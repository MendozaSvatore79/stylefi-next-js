version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - node -v
            - nvm install 24.2.0 || nvm install 24
            - nvm use 24
            - node -v
            - npm ci --cache .npm --prefer-offline
        build:
          commands:
            - npm run build
          artifacts:
            baseDirectory: .next
            files:
              - '**/*'
          cache:
            paths:
              - node_modules/**/*
              - .next/cache/**/*

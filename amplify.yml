# Amplify Hosting (SSR, plataforma WEB_COMPUTE) para el monorepo de npm workspaces.
# La app está en apps/web (AMPLIFY_MONOREPO_APP_ROOT=apps/web en las variables de la app). Las órdenes corren en
# apps/web; la instalación y el build se hacen en la raíz del workspace (--prefix ../..), que es donde está el
# package-lock y desde donde se compila @stylefi/shared antes que la app.
version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 24
            - nvm use 24
            - node -v
            - npm ci --prefix ../.. --cache ../../.npm --prefer-offline
        build:
          commands:
            # Amplify solo entrega las variables al build, no al servidor SSR en ejecución: las que usa el servidor
            # (la llave secreta de Clerk y las NEXT_PUBLIC_*) se escriben en apps/web/.env.production, que Next carga
            # al arrancar. Se genera aquí, no se sube al repo y no se imprime en los logs.
            - env | grep -E '^(CLERK_SECRET_KEY|NEXT_PUBLIC_[A-Z0-9_]+)=' >> .env.production
            - npm run build --prefix ../..
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - ../../.npm/**/*
          - .next/cache/**/*

version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - node -v
            - nvm install 24.2.0 || nvm install 24
            - nvm use 24
            - node -v
            - npm ci --cache .npm --prefer-offline
        build:
          commands:
            - env | grep -e CLERK_SECRET_KEY -e NEXT_PUBLIC_ >> .env.production
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*

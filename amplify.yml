version: 1
frontend:
  phases:
    preBuild:
      commands:
        - node -v
        - nvm install 24.2.0 || nvm install 24
        - nvm use 24
        - node -v
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: apps/web/.next  # O la ruta donde se compile tu app de Next.js dentro de apps/
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
      - apps/web/.next/cache/**/*

# PRs semanales con actualizaciones de dependencias (npm) y de las acciones de GitHub. Cada PR corre el CI y nunca
# se une solo (unir a main despliega en Amplify).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Mexico_City
    open-pull-requests-limit: 5
    groups:
      menores:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Mexico_City

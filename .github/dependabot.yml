# PRs semanales con actualizaciones de dependencias (npm) y de las acciones de GitHub. Cada PR corre el CI y nunca
# se une solo (unir a main despliega en Amplify). Las versiones mayores se ignoran: se hacen a mano, una por una.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Mexico_City
    open-pull-requests-limit: 5
    groups:
      menores:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Mexico_City
